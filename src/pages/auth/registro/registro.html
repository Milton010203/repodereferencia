<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>

    <!-- Si usás un CSS general -->
    <link rel="stylesheet" href="/src/pages/auth/login/login.css" />
  </head>

  <body>
    <div class="container">
        

        <form class="loginform" id="registerForm">
            <h1>REGISTRO DE USUARIO</h1>
        <div>
            <label for="email">Email</label>
            <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="ejemplo@mail.com"
            />
        </div>

        <div>
            <label for="password">Contraseña</label>
            <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="********"
            />
        </div>

        <button class="btn" type="submit">Registrarse</button>
        <p>
            ¿Ya tenés cuenta?
            <a href="/src/pages/auth/login/login.html">Iniciar sesión</a>
        </p>
        
        </form>

        

    </div>
    
    <!-- Importante: el script del registro -->
    <script type="module" src="/src/pages/auth/registro/registro.ts"></script>
  </body>
</html>
